name: Deploy Hugo Site to Server

on:
  push:
    branches: [ master ]  # 如果你的默认分支是 master，请改为 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true  # 如果你的主题是 Git 子模块，需要这个

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'  # 或者指定版本，如 '0.120.4'

      - name: Build site
        run: hugo --minify  # 生成静态文件到 public 目录

      - name: Deploy to Server via rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: public/
          remote_path: ${{ secrets.SERVER_DEST }}
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SERVER_SSH_KEY }}
