baseURL = "https://annouimo-blog.pages.dev"
languageCode = "zh-CN"
title = "Annouimo 的个人博客"
theme = "hugo-PaperMod"
defaultContentLanguage = "zh"
buildDrafts = false

[params]
  description = ""
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  math = true
  mainSections = ["blog", "notes"]

  [params.profileMode]
    enabled = true
    title = "Annouimo"
    subtitle = ""
    imageUrl = "images/avatar.jpg"

[[module.imports]]
  path = "github.com/KKKZOZ/hugo-admonitions"

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "随笔"
    url = "/blog/"
    weight = 1

  [[menu.main]]
    identifier = "notes"
    name = "数理"
    url = "/notes/"
    weight = 2

  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 3
