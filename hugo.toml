baseURL = "https://www.annouimo.cn"
languageCode = "zh-CN"
title = "Annouimo 的个人博客"
theme = "hugo-PaperMod"
defaultContentLanguage = "zh"
buildDrafts = false

[params]
  description = ""
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  math = true
  mainSections = ["blog", "notes", "tech"]

  [params.profileMode]
    enabled = true
    title = "Annouimo"
    subtitle = ""
    imageUrl = "images/avatar.jpg"

  [params.assets]
    favicon = "favicons/favicon.ico"
    favicon16x16 = "favicons/favicon-16x16.png"
    favicon32x32 = "favicons/favicon-32x32.png"
    apple_touch_icon = "favicons/apple-touch-icon.png"
    
  [params.label]
    icon = "images/avatar.jpg"
    iconHeight = 35

[[module.imports]]
  path = "github.com/KKKZOZ/hugo-admonitions"

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "随笔"
    url = "/blog/"
    weight = 1

  [[menu.main]]
    identifier = "notes"
    name = "数理"
    url = "/notes/"
    weight = 2

  [[menu.main]]
    identifier = "tech"
    name = "技术"
    url = "/tech/"
    weight = 3

  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 4
